<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Seguimiento en vivo - TLE + EKF</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body { margin: 0; font-family: sans-serif; }
  #map { height: 100vh; width: 100%; }
  .info { position: absolute; top: 10px; right: 10px; z-index: 1000;
          background: rgba(255,255,255,0.92); padding: 10px 14px; border-radius: 8px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.3); font-size: 12px; min-width: 260px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<div class="info" id="info">
  <b>Seguimiento en vivo</b><br/>
  Satélite: <span id="sat">-</span><br/>
  Tiempo: <span id="t">-</span><br/>
  <hr style="margin:4px 0"/>
  <span class="dot" style="background:#1f77b4"></span>TLE (SGP4): <span id="tle">-</span><br/>
  <span class="dot" style="background:#d62728"></span>EKF (estimado): <span id="ekf">-</span><br/>
  <span class="dot" style="background:#ff7f0e"></span>Medición: <span id="meas">-</span><br/>
  <hr style="margin:4px 0"/>
  <small>EKF corrige el TLE con mediciones simuladas (500 m).</small>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    maxBounds: [[-90, -180], [90, 180]],
    maxBoundsViscosity: 1.0,
    worldCopyJump: false
  }).setView([0, 0], 2);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 8, noWrap: true, attribution: 'Tiles &copy; Esri, DeLorme, NAVTEQ'
  }).addTo(map);

  const mTle = L.circleMarker([0,0], {radius:6, color:'#1f77b4', fillColor:'#1f77b4', fillOpacity:0.9}).addTo(map).bindPopup('TLE (SGP4)');
  const mEkf = L.circleMarker([0,0], {radius:8, color:'#d62728', fillColor:'#d62728', fillOpacity:0.9}).addTo(map).bindPopup('EKF estimado');
  const mMeas = L.circleMarker([0,0], {radius:4, color:'#ff7f0e', fillColor:'#ff7f0e', fillOpacity:0.9}).addTo(map).bindPopup('Medición');

  const trailTle = L.polyline([], {color:'#1f77b4', weight:1.5, opacity:0.5}).addTo(map);
  const trailEkf = L.polyline([], {color:'#d62728', weight:2, opacity:0.7}).addTo(map);
  const trailTlePts = [];
  const trailEkfPts = [];

  async function poll() {
    try {
      const res = await fetch('live_position.json?_=' + Date.now());
      if (!res.ok) return;
      const d = await res.json();
      const tle = [d.tle.lat, d.tle.lon];
      const ekf = [d.ekf.lat, d.ekf.lon];
      const meas = [d.meas.lat, d.meas.lon];
      mTle.setLatLng(tle);
      mEkf.setLatLng(ekf);
      mMeas.setLatLng(meas);
      trailTlePts.push(tle);
      trailEkfPts.push(ekf);
      if (trailTlePts.length > 300) { trailTlePts.shift(); trailEkfPts.shift(); }
      trailTle.setLatLngs(trailTlePts);
      trailEkf.setLatLngs(trailEkfPts);
      document.getElementById('sat').textContent = d.sat;
      document.getElementById('t').textContent = d.t;
      document.getElementById('tle').textContent = tle[0].toFixed(3) + ', ' + tle[1].toFixed(3) + ' (' + d.tle.alt.toFixed(0) + ' km)';
      document.getElementById('ekf').textContent = ekf[0].toFixed(3) + ', ' + ekf[1].toFixed(3) + ' (' + d.ekf.alt.toFixed(0) + ' km)';
      document.getElementById('meas').textContent = meas[0].toFixed(3) + ', ' + meas[1].toFixed(3);
      if (trailEkfPts.length === 1) map.setView(ekf, 4);
    } catch (e) {}
  }
  setInterval(poll, 1000);
  poll();
</script>
</body>
</html>
